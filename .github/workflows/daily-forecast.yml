name: Daily Forecast

on:
  schedule:
    # 每30分钟，每次跑都顺便结算昨天（幂等，已结算过会跳过）
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        default: ''
      settle_only:
        description: '仅结算指定日期（YYYY-MM-DD），跳过预测'
        required: false
        default: ''
      backfill_days:
        description: '结算回溯天数（默认4天）'
        required: false
        default: '4'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sporttery-engine
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Sync with remote (avoid build-time conflicts)
        # 2026-08-07 修复：build 前先同步远端。否则 build 产物与远端
        # 提交在 commit 后 pull --rebase 时冲突，冲突标记会写进 web/*.html
        # （8/7 Pages 页面出现 <<<<<<< HEAD 的根因）。
        run: |
          git pull --rebase origin main || echo "⚠ 同步失败（继续，commit 步骤有冲突检测兜底）"
          # 防御：若上一步 rebase 失败残留冲突标记，立即清理重建
          if grep -rl '<<<<<<< HEAD' web/ data/ 2>/dev/null | grep -q .; then
            echo "⚠ 检测到冲突标记残留，强制恢复远端版本"
            git checkout --theirs -- web/ data/ 2>/dev/null || true
            git checkout -- web/ data/ 2>/dev/null || true
          fi

      - name: Fetch DJYY SSR odds
        run: |
          python scripts/fetch_djyy_ssr.py || echo "⚠ DJYY SSR 抓取失败（辅助数据源，继续）"

      - name: Fetch Sina results + odds
        run: |
          python scripts/fetch_sina_results.py || echo "⚠ 新浪赛果抓取失败（继续，结算时再补抓）"
          python scripts/fetch_sina_odds.py || echo "⚠ 新浪赔率抓取失败（辅助数据源，继续）"

      - name: Settlement only (manual trigger)
        if: ${{ github.event.inputs.settle_only != '' }}
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          echo "→ 仅结算模式: ${{ github.event.inputs.settle_only }}"
          python scripts/fetch_sina_results.py --date "${{ github.event.inputs.settle_only }}" || echo "  ⚠ 新浪赛果刷新失败"
          python -m engine.main --settle --date "${{ github.event.inputs.settle_only }}"
          python engine/build_site.py

      - name: Run daily forecast
        if: ${{ github.event.inputs.settle_only == '' }}
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            # 竞彩使用北京时间，GitHub Actions 默认 UTC
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          python -m engine.main --date "$DATE"

      - name: Settlement (last N days, idempotent)
        if: ${{ github.event.inputs.settle_only == '' }}
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          # 每次运行都结算最近 N 天（默认4天）：先刷新该日新浪赛果（幂等合并），再结算。
          # 引擎侧幂等：已结算场次自动跳过（Elo/熔断/权重不重复更新），
          # review.json 每次都会重新生成，因此复盘不会被"已存在即跳过"冻结。
          BACKFILL_DAYS="${{ github.event.inputs.backfill_days || '4' }}"
          for DAYS_BACK in $(seq 1 "$BACKFILL_DAYS"); do
            D=$(TZ=Asia/Shanghai date -d "$DAYS_BACK days ago" +%Y-%m-%d)
            echo "→ [结算] $D (${DAYS_BACK} 天前)"
            python scripts/fetch_sina_results.py --date "$D" || echo "  ⚠ 新浪赛果刷新失败: $D"
            # 2026-08-05 修复：结算失败必须让 workflow 红色失败，绝不被 || echo 吞掉。
            # 教训：8/5 09:41 结算 8/3/8/4 静默失败（_src_hit 缺参抛异常被兜底掩盖），
            #       页面绿但数据没更新。fetch 失败可容忍（幂等下次补抓），结算失败=系统 bug 必须暴露。
            python -m engine.main --settle --date "$D" || { echo "::error::结算失败: $D（系统 bug，必须修复）"; exit 1; }
          done


      - name: Build site
        run: python engine/build_site.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-08-07 修复：commit 前强制检测冲突标记——任何数据/网页文件
          # 含 <<<<<<< HEAD 一律中止提交（宁可这次不推送，绝不污染线上）。
          # 根因：pull --rebase 冲突会把冲突标记写进构建产物，曾被 push 到
          # Pages 展示（8/7 六张卡片出现 <<<<<<< HEAD）。
          if grep -rl '<<<<<<< HEAD' web/ data/ 2>/dev/null | grep -q .; then
            echo "::error::检测到冲突标记残留（web/ 或 data/），中止提交，避免污染线上"
            exit 1
          fi
          git add data/ web/
          git diff --cached --quiet || git commit -m "daily: forecast $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
          # 兜底：rebase 若产生冲突标记（理论已由上面检测拦截），再次检测
          if grep -rl '<<<<<<< HEAD' web/ data/ 2>/dev/null | grep -q .; then
            echo "::error::push 后仍检测到冲突标记残留，请人工检查"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
