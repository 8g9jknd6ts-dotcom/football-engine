name: Daily Forecast

on:
  schedule:
    # 每30分钟，每次跑都顺便结算昨天（幂等，已结算过会跳过）
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sporttery-engine
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Fetch DJYY SSR odds
        run: python scripts/fetch_djyy_ssr.py

      - name: Run daily forecast
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then
            # 竞彩使用北京时间，GitHub Actions 默认 UTC
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          python -m engine.main --date "$DATE"

      - name: Settlement (yesterday, if not done yet)
        env:
          SPORTTERY_PROXY: ${{ secrets.SPORTTERY_PROXY }}
        run: |
          YESTERDAY=$(TZ=Asia/Shanghai date -d 'yesterday' +%Y-%m-%d)
          # 检查 results.json 是否已存在（结算完成的标志）
          SETTLE_FILE="data/daily/${YESTERDAY}/results.json"
          if [ -f "$SETTLE_FILE" ]; then
            echo "✓ 结算已完成: $YESTERDAY (跳过)"
          else
            echo "→ 开始结算昨天: $YESTERDAY"
            python -m engine.main --settle --date "$YESTERDAY"
            # 如果昨天没有赛果，尝试结算前天（周末比赛可能延后出结果）
            if [ ! -f "data/daily/${YESTERDAY}/results.json" ]; then
              DAY_BEFORE=$(TZ=Asia/Shanghai date -d '2 days ago' +%Y-%m-%d)
              SETTLE_FILE2="data/daily/${DAY_BEFORE}/results.json"
              if [ ! -f "$SETTLE_FILE2" ]; then
                echo "→ 尝试结算前天: $DAY_BEFORE"
                python -m engine.main --settle --date "$DAY_BEFORE"
              fi
            fi
          fi


      - name: Build site
        run: python engine/build_site.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/
          git diff --cached --quiet || git commit -m "daily: forecast $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git stash --include-untracked 2>/dev/null || true
            git pull --rebase origin main && git stash pop 2>/dev/null || true
            git push && break
            sleep 5
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
